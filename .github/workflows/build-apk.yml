name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: true
      npm_config_legacy_peer_deps: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update README release links with repository slug
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          if grep -q "OWNER/REPO" README.md; then
            sed -i "s|OWNER/REPO|${{ github.repository }}|g" README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update README release download links [skip ci]" || true
            git push || echo "Skipping README push (check branch permissions)"
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Generate Android project with Capacitor
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: hej-goteborg-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Hej-Goteborg-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Hej-Goteborg-latest.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "Hej-Goteborg-${GITHUB_REF_NAME}.apk" \
              "Hej-Goteborg-latest.apk" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "Hej-Goteborg-${GITHUB_REF_NAME}.apk" \
              "Hej-Goteborg-latest.apk" \
              --title "Hej Göteborg $GITHUB_REF_NAME" \
              --notes "Automatski izgrađen Android APK za Hej Göteborg ($GITHUB_REF_NAME)."
          fi
